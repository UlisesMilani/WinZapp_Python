name: Prepare reviewed denoise integration branch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/prep/incremental-denoise-upload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Import reviewed history without changing saved branches
        run: |
          git fetch origin prep/incremental-denoise-pr
          sha256sum 2-3-alpha5678.bundle
          git bundle verify 2-3-alpha5678.bundle
          git fetch ./2-3-alpha5678.bundle refs/heads/prep/incremental-denoise-pr:refs/heads/prep/incremental-denoise-pr
          test "$(git rev-parse prep/incremental-denoise-pr)" = 396f0f007de85c15007796677e9d726958751daf
          git push origin prep/incremental-denoise-pr:refs/heads/prep/incremental-denoise-pr
