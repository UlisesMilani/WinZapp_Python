name: Prepare reviewed denoise integration branch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/prep/incremental-denoise-upload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Import reviewed history without changing saved branches
        run: |
          git fetch https://github.com/gabrielhhaber/WinZapp_Python.git main
          sha256sum 1-integration.bundle
          git bundle verify 1-integration.bundle
          git fetch ./1-integration.bundle refs/heads/prep/incremental-denoise-pr:refs/heads/prep/incremental-denoise-pr
          test "$(git rev-parse prep/incremental-denoise-pr)" = 5cc5fea79c35ea9e0e86b5330dd67629ae334834
          git push origin prep/incremental-denoise-pr:refs/heads/prep/incremental-denoise-pr
