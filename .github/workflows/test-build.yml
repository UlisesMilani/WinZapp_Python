# Branch test build — a real, CI-produced WinZapp from any branch, on demand.
#
# The point is to stop trusting a local build.py when trying out a branch: this
# runs the same test suite and the same build pipeline a release does (they all
# call build-windows.yml), so what you download is built the way the shipped
# artifacts are built, on a clean machine, with the suite confirmed green.
#
# What it deliberately does NOT do is create a release. The result is an
# ARTIFACT, and client/updater.py reads the Releases API — so a test build is
# invisible to it by construction. There is no way for a branch build to be
# offered to a user, not even one on the alpha channel. It also leaves no tag
# and no entry on the Releases page, and expires on its own.
#
# Run it from the web (Actions > Branch test build > Run workflow, pick the
# branch) or from the CLI:
#
#   gh workflow run test-build.yml --ref feat/group-media-tab
#   gh run watch $(gh run list --workflow=test-build.yml --limit 1 --json databaseId --jq '.[0].databaseId')
#   gh run download <run-id> -n winzapp-test-build
#
# `--ref` is what picks the branch: a workflow_dispatch runs the workflow file
# from that ref and builds that ref.
name: Branch test build

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the test suite first (leave on unless you know why not)
        required: false
        type: boolean
        default: true
      run_network_tests:
        description: Check model catalogue URLs against their remote hosts
        required: false
        type: boolean
        default: true
      retention_days:
        description: Days to keep the downloadable build
        required: false
        type: string
        default: "14"

# One test build at a time per branch. A second dispatch of the same branch
# supersedes the first rather than queueing behind ten minutes of work nobody
# is waiting for any more. Different branches build in parallel.
concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  # Same gate the release pipelines use, and for the same reason: it is cheap,
  # it fails fast, and a branch that cannot pass its own tests is not worth ten
  # minutes of build. Skippable only through an explicit input, for the case
  # where you are deliberately building a branch with a known-red suite to look
  # at the UI.
  # The suite in 4 jobs at once, each with one pytest worker per vCPU
  # (-n auto). Every test module lands in exactly one shard, and the modules
  # that put real wx windows up run one after another on a single worker
  # (tests/ci_shards.py). --durations lists each shard's slowest tests, so
  # the next slowdown has a name. One job ran ~22,000 tests in ~25 minutes.
  test-shard:
    name: Run test suite (shard ${{ matrix.shard }}/4)
    if: inputs.run_tests
    strategy:
      # Every shard to the end: one run reports every failure, not the first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv itself, pinned like every action: "latest" would let a release
          # build change toolchains on the day uv ships.
          version: "0.12.13"

      - name: Install Python dependencies
        run: uv sync --locked


      # Match the build's portable Node version: runtime tests execute actual
      # patched WPPConnect files under Node and need its TypeScript compiler.
      - name: Download portable Node.js
        shell: pwsh
        run: |
          $version = (python -c "import runpy; print(runpy.run_path('client/node_download_config.py')['NODE_VERSION'])").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+
      - name: Run pytest
        env:
          WINZAPP_RUN_NETWORK_TESTS: ${{ inputs.run_network_tests && '1' || '' }}
        run: uv run pytest --run-wx-gui -n auto --shard ${{ matrix.shard }}/4 --durations=20 -rs

  # The suite's single verdict, under the name every `needs: test` and the
  # branch ruleset already use: it fails when any shard did not pass.
  test:
    name: Run test suite
    needs: test-shard
    if: ${{ always() && inputs.run_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.test-shard.result }}" = "success"

  build:
    # always() so the build still runs when `test` was skipped by run_tests
    # being false — without it, a skipped dependency skips this job too. The
    # result check is what still stops a FAILED suite from producing a build.
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    uses: ./.github/workflows/build-windows.yml
    with:
      # No version is passed on purpose: the build keeps whatever
      # client/version.py already holds on the branch. A test build must not
      # claim a version of its own — that is what keeps it unorderable against
      # real releases and impossible to confuse with one.
      artifact-name: winzapp-test-build
      retention-days: ${{ fromJSON(inputs.retention_days) }}

  # A build whose suite was skipped is easy to mistake for a normal one weeks
  # later, when only the artifact is left. Say so in the run summary, which is
  # what you actually look at when picking a run to download.
  summary:
    needs: [test, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Write the run summary
        shell: bash
        run: |
          {
            echo "## Branch test build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            if [ "${{ needs.test.result }}" = "success" ]; then
              echo "| Test suite | passed |"
            else
              echo "| Test suite | **SKIPPED — this build was not verified** |"
            fi
            echo
            echo "Download \`winzapp-test-build\` from this run's Artifacts."
            echo "It contains \`WinZapp.zip\`, the installer, and \`SHA256SUMS.txt\`."
            echo
            echo "This is **not** a release: it has no tag, it is not on the"
            echo "Releases page, and the in-app updater cannot see it."
          } >> "$GITHUB_STEP_SUMMARY"
) {
            Write-Error "Could not read NODE_VERSION from client/node_download_config.py (got '$version')"
            exit 1
          }
          $zip = "node-v$($version)-win-x64.zip"
          Invoke-WebRequest "https://nodejs.org/dist/v$($version)/$zip" -OutFile $zip -UseBasicParsing
          Invoke-WebRequest "https://nodejs.org/dist/v$($version)/SHASUMS256.txt" -OutFile "SHASUMS256.txt" -UseBasicParsing
          $expected = (Select-String -Path "SHASUMS256.txt" -Pattern "  $zip$").Line.Split(" ")[0]
          if (-not $expected) {
            Write-Error "Could not find a checksum for $zip"
            exit 1
          }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Error "Node.js download checksum mismatch: expected $expected, got $actual"
            exit 1
          }
          Expand-Archive $zip -DestinationPath . -Force
          Move-Item "node-v$($version)-win-x64" "client\node"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\client\node"

      # Reuse the same API dependency cache as the build. setup_api.py keeps
      # this directory when cloning WPPConnect Server.
      - name: Cache API node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: client/api/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('client/api/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Set up WPPConnect Server for runtime tests
        run: uv run python setup_api.py

      # Match the build's dependency installation; skip Puppeteer's large
      # browser download because this job validates tests, not first-run setup.
      - name: Install API dependencies and build
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "1"
        shell: pwsh
        run: |
          $node = "$env:GITHUB_WORKSPACE\client\node\node.exe"
          $npm = "$env:GITHUB_WORKSPACE\client\node\node_modules\npm\bin\npm-cli.js"
          Set-Location "$env:GITHUB_WORKSPACE\client\api"
          & $node $npm install --no-audit --no-fund --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scripts = (Get-Content "package.json" | ConvertFrom-Json).scripts
          if ($null -ne $scripts.'db:generate') {
            & $node $npm run db:generate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $node $npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Match CI's serial cache initialization before xdist workers import COM.
      - name: Warm the comtypes cache
        run: uv run python -c "import comtypes.client"

      - name: Run pytest
        run: uv run pytest --run-wx-gui -n auto --shard ${{ matrix.shard }}/4 --durations=20 -rs

  # The suite's single verdict, under the name every `needs: test` and the
  # branch ruleset already use: it fails when any shard did not pass.
  test:
    name: Run test suite
    needs: test-shard
    if: ${{ always() && inputs.run_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.test-shard.result }}" = "success"

  build:
    # always() so the build still runs when `test` was skipped by run_tests
    # being false — without it, a skipped dependency skips this job too. The
    # result check is what still stops a FAILED suite from producing a build.
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    uses: ./.github/workflows/build-windows.yml
    with:
      # No version is passed on purpose: the build keeps whatever
      # client/version.py already holds on the branch. A test build must not
      # claim a version of its own — that is what keeps it unorderable against
      # real releases and impossible to confuse with one.
      artifact-name: winzapp-test-build
      retention-days: ${{ fromJSON(inputs.retention_days) }}

  # A build whose suite was skipped is easy to mistake for a normal one weeks
  # later, when only the artifact is left. Say so in the run summary, which is
  # what you actually look at when picking a run to download.
  summary:
    needs: [test, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Write the run summary
        shell: bash
        run: |
          {
            echo "## Branch test build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            if [ "${{ needs.test.result }}" = "success" ]; then
              echo "| Test suite | passed |"
            else
              echo "| Test suite | **SKIPPED — this build was not verified** |"
            fi
            echo
            echo "Download \`winzapp-test-build\` from this run's Artifacts."
            echo "It contains \`WinZapp.zip\`, the installer, and \`SHA256SUMS.txt\`."
            echo
            echo "This is **not** a release: it has no tag, it is not on the"
            echo "Releases page, and the in-app updater cannot see it."
          } >> "$GITHUB_STEP_SUMMARY"
