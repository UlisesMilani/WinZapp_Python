name: Prepare reviewed denoise integration branch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/prep/incremental-denoise-upload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Import reviewed history without changing saved branches
        run: |
          git fetch origin prep/incremental-denoise-pr
          sha256sum 1-2-guide.bundle
          git bundle verify 1-2-guide.bundle
          git fetch ./1-2-guide.bundle refs/heads/prep/incremental-denoise-pr:refs/heads/prep/incremental-denoise-pr
          test "$(git rev-parse prep/incremental-denoise-pr)" = 1cff74e124794012ce12051fed8b7652e935897b
          git push origin prep/incremental-denoise-pr:refs/heads/prep/incremental-denoise-pr
