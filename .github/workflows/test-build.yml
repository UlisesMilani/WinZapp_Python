name: Apply cooperative refresh trial patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/test/incremental-denoise'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/incremental-denoise
      - name: Apply checked trial patch
        env:
          PATCH: 
        run: |
          python - <<'PYCODE'
          import os,base64,zlib,pathlib
          pathlib.Path('/tmp/refresh.patch').write_bytes(zlib.decompress(base64.b64decode(os.environ['PATCH'])))
          PYCODE
          git apply --check /tmp/refresh.patch
          git apply /tmp/refresh.patch
          git show adc93b1d381860e3a57ac33bbb9fba3ce71604c3:.github/workflows/test-build.yml > .github/workflows/test-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/core/cooperative_rows.py client/ui/conversation_panel client/ui/conversations.py tests/test_cooperative_rows.py .github/workflows/test-build.yml
          git diff --cached --check
          git commit -m 'Keep large message-list refreshes responsive between batches'
          git push origin HEAD:refs/heads/test/incremental-denoise
