name: 5403 native writing window render
permissions:
  contents: read
jobs:
  visual:
    name: Render native synthetic writing dialogs
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - name: Preserve exact source and patch bytes on Windows
      run: git config --global core.autocrlf false
    - name: Read validation inputs
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: validation
        persist-credentials: false
    - name: Read exact upstream base
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: gabrielhhaber/WinZapp_Python
        ref: 8deb4047d1ab0a0e3bddc43e39e1ab21ccbf3908
        path: app
        persist-credentials: false
    - name: Verify and apply the complete reviewed patch
      shell: bash
      run: 'python - <<''PYVERIFY''

        import hashlib,pathlib,subprocess

        patch=pathlib.Path(''validation/1-winzapp-ai-prototype-5403.patch'')

        expected=''f8ae4d03c0b42898d66073a643992ddb948243ff130c6ce2294a18b47dedfff5''

        assert hashlib.sha256(patch.read_bytes()).hexdigest()==expected

        assert subprocess.check_output([''git'',''-C'',''app'',''rev-parse'',''HEAD''],text=True).strip()==''8deb4047d1ab0a0e3bddc43e39e1ab21ccbf3908''

        subprocess.run([''git'',''-C'',''app'',''apply'',''--check'',str(patch.resolve())],check=True)

        subprocess.run([''git'',''-C'',''app'',''apply'',str(patch.resolve())],check=True)

        subprocess.run([''git'',''-C'',''app'',''diff'',''--check''],check=True)

        print(''Verified base and full patch:'',expected)

        PYVERIFY

        '
    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - name: Set up uv without a shared cache
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: 0.12.13
        enable-cache: false
    - name: Install locked development dependencies
      working-directory: app
      run: uv sync --locked
    - name: Verify real Windows wx and warm COM imports
      working-directory: app
      run: uv run python -c "import sys, wx, comtypes.client, win32com.client.gencache; from accessible_output2 import outputs;
        print(sys.version); print(wx.version()); print(wx.PlatformInfo); comtypes.client.GetModule('oleacc.dll'); print('COM
        caches initialized before parallel workers')"
    - name: Render each window directly rather than the obscured desktop
      working-directory: app
      shell: bash
      run: "uv run python - <<'PYRENDER'\nfrom pathlib import Path\np=Path('tests/test_writing_help_dialog_gui.py')\ns=p.read_text(encoding='utf-8')\n\
        a=s.index('            rect = dialog.GetScreenRect()')\nb=s.index('    finally:',a)\ns=s[:a]+\"\"\"            import\
        \ ctypes, win32gui, win32ui\n            from PIL import Image\n            hwnd = dialog.GetHandle()\n          \
        \  left, top, right, bottom = win32gui.GetWindowRect(hwnd)\n            width, height = right-left, bottom-top\n \
        \           source = win32ui.CreateDCFromHandle(win32gui.GetWindowDC(hwnd))\n            target = source.CreateCompatibleDC()\n\
        \            bitmap = win32ui.CreateBitmap()\n            bitmap.CreateCompatibleBitmap(source, width, height)\n \
        \           target.SelectObject(bitmap)\n            assert ctypes.windll.user32.PrintWindow(hwnd, target.GetSafeHdc(),\
        \ 3)\n            info=bitmap.GetInfo()\n            image=Image.frombuffer('RGB',(info['bmWidth'],info['bmHeight']),bitmap.GetBitmapBits(True),'raw','BGRX',0,1)\n\
        \            image.save(str(folder / ('writing-' + language + '.png')))\n            win32gui.DeleteObject(bitmap.GetHandle())\n\
        \            target.DeleteDC()\n            source.DeleteDC()\n\"\"\"+s[b:]\np.write_text(s,encoding='utf-8')\n\n\
        PYRENDER\n"
    - name: Run synthetic native window capture
      working-directory: app
      shell: pwsh
      run: '$env:WINZAPP_VISUAL_OUTPUT = "$env:GITHUB_WORKSPACE\window-output"

        uv run python -m pytest tests/test_writing_help_dialog_gui.py --run-wx-gui -q

        exit $LASTEXITCODE

        '
    - name: Upload direct window renders
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-window-renders-5403
        path: window-output/*.png
        if-no-files-found: error
        retention-days: 2
'on':
  push:
    branches:
    - ai-prototype-validation-5403
    paths:
    - .github/workflows/ai-visual-5403.yml
