    - name: Record validation scope
      if: always()
      shell: bash
      run: 'printf ''%s\n'' ''Experimental summary and writing-help adaptation for 5408.'' ''No live providers, personal conversations,
        saved account sessions or NVDA usability test.'' ''Base: fb3ee083fa9e51fe4459e4b1b4c6414004717833'' ''Patch SHA256:
        e3c8e25520e12cda6fb5fac87f07531260530a44f605bb33da7469483fed2914'' >> "$GITHUB_STEP_SUMMARY"

