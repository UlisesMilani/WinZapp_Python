        \u062A\u0642\u0644\u0629 \u0642\u0628\u0644 \u062A\u0644\u0642\u064A \u0627\u0644\u0646\u0635. \u0631\u0627\u062C\u0639\
        \ \u0627\u0644\u0646\u062A\u064A\u062C\u0629 \u0648\u0627\u062E\u062A\u0631 \xAB{replace}\xBB \u0644\u0627\u0633\u062A\
