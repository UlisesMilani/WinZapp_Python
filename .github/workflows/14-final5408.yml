  build:
    name: Build verified experimental portable ZIP
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
    - name: Preserve exact source and patch bytes on Windows
      run: 'git config --global core.autocrlf false

        '
      working-directory: .
    - name: Read validation inputs
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: validation
        persist-credentials: false
    - name: Read exact upstream base
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: gabrielhhaber/WinZapp_Python
        ref: fb3ee083fa9e51fe4459e4b1b4c6414004717833
        path: app
        persist-credentials: false
    - name: Verify and apply the complete reviewed patch
      shell: bash
      run: 'python - <<''PYVERIFY''

        import hashlib,pathlib,subprocess

        patch=pathlib.Path(''validation/9-winzapp-ai-prototype-5408.patch'')

        expected=''e3c8e25520e12cda6fb5fac87f07531260530a44f605bb33da7469483fed2914''

        assert hashlib.sha256(patch.read_bytes()).hexdigest()==expected

        assert subprocess.check_output([''git'',''-C'',''app'',''rev-parse'',''HEAD''],text=True).strip()==''fb3ee083fa9e51fe4459e4b1b4c6414004717833''

        subprocess.run([''git'',''-C'',''app'',''apply'',''--check'',str(patch.resolve())],check=True)

        subprocess.run([''git'',''-C'',''app'',''apply'',str(patch.resolve())],check=True)

        subprocess.run([''git'',''-C'',''app'',''diff'',''--check''],check=True)

        print(''Verified base and full patch:'',expected)

        PYVERIFY

        '
      working-directory: .
    - name: Set up MSYS2 (GCC + windres)
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
      with:
        msystem: UCRT64
        update: false
        install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-zlib
    - name: Add MSYS2 UCRT64 bin to Windows PATH
      shell: msys2 {0}
      run: 'echo "$(cygpath -w /ucrt64/bin)" >> "$GITHUB_PATH"

        '
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
