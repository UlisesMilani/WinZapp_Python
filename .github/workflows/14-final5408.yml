        \ separado.','it':'Riepiloghi dei messaggi non letti con consenso separato.','pl':'Podsumowania nieprzeczytanych wiadomo\u015B\
        ci z osobn\u0105 zgod\u0105.','ro':'Rezumate ale mesajelor necitite cu acord separat.','tr-TR':'Ayr\u0131 onayla okunmam\u0131\
        \u015F sohbet \xF6zetleri.','ar':'\u0645\u0644\u062E\u0635\u0627\u062A \u0627\u0644\u0631\u0633\u0627\u0626\u0644\
        \ \u063A\u064A\u0631 \u0627\u0644\u0645\u0642\u0631\u0648\u0621\u0629 \u0628\u0645\u0648\u0627\u0641\u0642\u0629 \u0645\
        \u0633\u062A\u0642\u0644\u0629.'}[loc]\n row='  <tr><td class=\"field-name\">'+{'es-ES':'Prototipo','en-US':'Prototype','pt-BR':'Prot\xF3\
        tipo','pt-PT':'Prot\xF3tipo','it':'Prototipo','pl':'Prototyp','ro':'Prototip','tr-TR':'Prototip','ar':'\u0646\u0645\
        \u0648\u0630\u062C \u062A\u062C\u0631\u064A\u0628\u064A'}[loc]+'</td><td>'+html.escape(summary+' '+change)+'</td></tr>\\\
        n'\n p.write_text(s[:i]+row+s[i:])\n\nPYDOC\nuv run python apply_docs.py\nuv run python docs/user-guide/verificar_guia.py\
        \ . --registrar\nuv run python docs/user-guide/gerar_guia.py .\n"
    - name: Set up WPPConnect Server
      run: 'uv run python setup_api.py

        '
    - name: Verify the homologated WPPConnect version matches what was built
      shell: pwsh
      run: "$pkg = Get-Content \"client\\api\\package.json\" -Raw | ConvertFrom-Json\n$built = $pkg.version\nif ([string]::IsNullOrWhiteSpace($built))\
        \ {\n  Write-Error \"Could not read a version from client/api/package.json\"\n  exit 1\n}\n$declared = (Get-Content\
        \ \"client\\wpp_minimum_version.txt\" -Raw).Trim()\nif ([string]::IsNullOrWhiteSpace($declared)) {\n  Write-Error\
        \ \"client/wpp_minimum_version.txt is missing or empty\"\n  exit 1\n}\nif ($declared -ne $built) {\n  Write-Error\
        \ \"client/wpp_minimum_version.txt says $declared but client/api/ was built from $built. Update the committed file\
        \ (and client/api_patches/package.json) on purpose.\"\n  exit 1\n}\nWrite-Output \"[INFO] client/wpp_minimum_version.txt:\
        \ $declared\"\n"
    - name: Install API dependencies and build
      env:
        PUPPETEER_SKIP_DOWNLOAD: '1'
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: '1'
      run: "$node = \"$env:GITHUB_WORKSPACE\\app\\client\\node\\node.exe\"\n$npm  = \"$env:GITHUB_WORKSPACE\\app\\client\\\
        node\\node_modules\\npm\\bin\\npm-cli.js\"\n\nSet-Location \"$env:GITHUB_WORKSPACE\\app\\client\\api\"\n\n& $node\
        \ $npm install --no-audit --no-fund --legacy-peer-deps\n\n$scripts = (Get-Content \"package.json\" | ConvertFrom-Json).scripts\n\
        if ($null -ne $scripts.'db:generate') {\n  & $node $npm run db:generate\n}\n\n& $node $npm run build\n"
    - name: Build portable only with both connection engines
      shell: bash
      run: 'uv run python - <<''PYBUILD''

        import build

        build.ensure_build_assets()

        build.check_tools()

        build.pyinstaller_compile()

        build.freeze_neonize_bridge()

        build.assemble_staging()

        build.create_portable_zip()

        PYBUILD

        '
    - name: Verify dist/WinZapp.zip contents
      run: "Add-Type -AssemblyName System.IO.Compression.FileSystem\n$zip = [System.IO.Compression.ZipFile]::OpenRead(\"dist\\\
        WinZapp.zip\")\ntry {\n  $entries = $zip.Entries | ForEach-Object { $_.FullName }\n  $hasSounds   = ($entries | Where-Object\
        \ { $_ -like \"WinZapp/sounds/*\" }).Count -gt 0\n  $hasLib      = ($entries | Where-Object { $_ -like \"WinZapp/lib/bass.dll\"\
        \ }).Count -gt 0\n  $hasBassOpus = ($entries | Where-Object { $_ -like \"WinZapp/lib/bassopus.dll\" }).Count -gt 0\n\
        \  $hasExe      = ($entries | Where-Object { $_ -eq   \"WinZapp/WinZapp.exe\" }).Count -gt 0\n  $noNodeExe   = ($entries\
        \ | Where-Object { $_ -eq   \"WinZapp/node/node.exe\" }).Count -eq 0\n  $hasServerJs = ($entries | Where-Object {\
        \ $_ -eq   \"WinZapp/api/dist/server.js\" }).Count -gt 0\n  $hasFfmpeg   = ($entries | Where-Object { $_ -eq   \"\
        WinZapp/lib/ffmpeg.exe\" }).Count -gt 0\n  $hasBridge   = ($entries | Where-Object { $_ -eq   \"WinZapp/neonize_bridge/neonize_bridge.exe\"\
        \ }).Count -gt 0\n  $hasNeonize  = ($entries | Where-Object { $_ -eq   \"WinZapp/neonize_bridge/_internal/neonize/neonize-windows-amd64.dll\"\
        \ }).Count -gt 0\n  $hasApiPatches = ($entries | Where-Object { $_ -eq \"WinZapp/api_patches/src/controller/messageController.ts\"\
        \ }).Count -gt 0\n  Write-Host \"WinZapp.exe        : $hasExe\"\n  Write-Host \"sounds/*           : $hasSounds\"\n\
        \  Write-Host \"lib/bass.dll       : $hasLib\"\n  Write-Host \"lib/bassopus       : $hasBassOpus\"\n  Write-Host \"\
        no node/node.exe   : $noNodeExe\"\n  Write-Host \"api/dist/server.js : $hasServerJs\"\n  Write-Host \"ffmpeg     \
        \        : $hasFfmpeg\"\n  Write-Host \"neonize_bridge.exe : $hasBridge\"\n  Write-Host \"neonize DLL        : $hasNeonize\"\
        \n  Write-Host \"api_patches/       : $hasApiPatches\"\n  if (-not ($hasSounds -and $hasLib -and $hasBassOpus -and\
        \ $hasExe -and $noNodeExe -and $hasServerJs -and $hasFfmpeg -and $hasBridge -and $hasNeonize -and $hasApiPatches))\
        \ {\n    Write-Error \"dist/WinZapp.zip is missing required entries - build failed.\"\n    exit 1\n  }\n} finally\
        \ {\n  $zip.Dispose()\n}\n"
    - name: Verify test portable identity and create manifest
      shell: bash
      run: "uv run python - <<'PYBUILD'\nfrom pathlib import Path\nimport hashlib,json,zipfile\np=Path('dist/WinZapp.zip')\n\
        with zipfile.ZipFile(p) as z:\n    bad=z.testzip()\n    assert bad is None, bad\n    names=z.namelist()\n    assert\
        \ any(n.startswith('WinZapp/languages/') for n in names), 'missing translations'\n    assert not any('sessions' in\
        \ n.lower() and n.endswith(('.db','.json')) for n in names), 'unexpected session data'\nh=hashlib.sha256(p.read_bytes()).hexdigest()\n\
        Path('dist/SHA256SUMS.txt').write_text(h+'  WinZapp.zip\\n',encoding='ascii')\nPath('dist/BUILD_INFO.txt').write_text('Experimental\
        \ unread-summary and writing-help portable. Not an official release.\\nBase: fb3ee083fa9e51fe4459e4b1b4c6414004717833\\\
        nCombined patch SHA256: e3c8e25520e12cda6fb5fac87f07531260530a44f605bb33da7469483fed2914\\nNo live providers or NVDA\
        \ usability tests performed.\\n',encoding='utf-8')\nprint('Portable bytes:',p.stat().st_size)\nprint('Portable SHA256:',h)\n\
        PYBUILD\n"
    - name: Upload test portable for delivery
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ai-prototype-5408-portable
        retention-days: 2
        compression-level: 0
        if-no-files-found: error
        path: 'app/dist/WinZapp.zip

          app/dist/SHA256SUMS.txt

          app/dist/BUILD_INFO.txt'
    needs:
    - test
'on':
  push:
    branches:
    - ai-prototype-validation-5403
    paths:
