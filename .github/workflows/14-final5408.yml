        \ korzystaj\u0105 ze skonfigurowanych dostawc\xF3w AI; bez dost\u0119pnego dostawcy oferowane jest tylko t\u0142umaczenie\
        \ przez Google. Ka\u017Cda us\u0142uga wymaga osobnej zgody przed otrzymaniem tekstu. Sprawd\u017A wynik i wybierz\
