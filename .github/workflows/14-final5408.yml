name: 5408 experimental summary and writing help
permissions:
  contents: read
concurrency:
  group: ai-prototype-validation-5408
  cancel-in-progress: true
jobs:
  test:
    name: Windows Python 3.13 shard ${{ matrix.shard }}/4
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
    steps:
    - name: Preserve exact source and patch bytes on Windows
      run: git config --global core.autocrlf false
    - name: Read validation inputs
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: validation
        persist-credentials: false
    - name: Read exact upstream base
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: gabrielhhaber/WinZapp_Python
        ref: fb3ee083fa9e51fe4459e4b1b4c6414004717833
        path: app
        persist-credentials: false
    - name: Verify and apply the complete reviewed patch
      shell: bash
      run: 'python - <<''PYVERIFY''

        import hashlib,pathlib,subprocess

        patch=pathlib.Path(''validation/9-winzapp-ai-prototype-5408.patch'')

        expected=''e3c8e25520e12cda6fb5fac87f07531260530a44f605bb33da7469483fed2914''

        assert hashlib.sha256(patch.read_bytes()).hexdigest()==expected

        assert subprocess.check_output([''git'',''-C'',''app'',''rev-parse'',''HEAD''],text=True).strip()==''fb3ee083fa9e51fe4459e4b1b4c6414004717833''

        subprocess.run([''git'',''-C'',''app'',''apply'',''--check'',str(patch.resolve())],check=True)

        subprocess.run([''git'',''-C'',''app'',''apply'',str(patch.resolve())],check=True)

        subprocess.run([''git'',''-C'',''app'',''diff'',''--check''],check=True)

        print(''Verified base and full patch:'',expected)

        PYVERIFY

        '
    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - name: Set up uv without a shared cache
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: 0.12.13
        enable-cache: false
    - name: Install locked development dependencies
      working-directory: app
      run: uv sync --locked
    - name: Add writing help changelogs and guides in all nine locales
      working-directory: app
      shell: bash
      run: "cat > apply_docs.py <<'PYDOC'\nfrom pathlib import Path\nimport html,polib\nr=Path.cwd()\ntexts={\n'es-ES':('Ayuda\
        \ para escribir: el nuevo bot\xF3n despu\xE9s de Emoji y el men\xFA contextual del campo abren la misma ventana. Permite\
        \ corregir, reformular, usar un tono profesional o alentador con los proveedores de IA configurados, o traducir con\
        \ Google. Pide permiso antes de enviar el borrador y muestra el resultado antes de reemplazarlo; nunca env\xEDa el\
        \ mensaje autom\xE1ticamente.', 'Escribe un borrador y usa el bot\xF3n \"{button}\" despu\xE9s de \"{emoji}\", o el\
        \ men\xFA contextual del campo. La ayuda est\xE1 disponible con texto editable, no vac\xEDo. Las cuatro acciones de\
        \ escritura usan tus proveedores de IA configurados; si no hay uno disponible, solo aparece la traducci\xF3n con Google.\
        \ Cada servicio pide su propio consentimiento antes de recibir el texto. Revisa el resultado y elige \"{replace}\"\
        \ si quieres usarlo. Si cambias de chat o modificas el borrador, no se reemplaza. El mensaje nunca se env\xEDa autom\xE1\
        ticamente.'),\n'en-US':('Writing help: the new button after Emoji and the composer context menu open the same window.\
        \ Correct, rephrase, use a professional or encouraging tone with configured AI providers, or translate with Google.\
        \ Consent is requested before sending the draft and the result is previewed before replacement; the message is never\
        \ sent automatically.', 'Write a draft and use \"{button}\" after \"{emoji}\", or the composer context menu. Help\
        \ is available for non-empty, editable text. The four writing actions use your configured AI providers; if none is\
        \ available, only Google translation is offered. Each service requests its own consent before receiving the text.\
        \ Review the result and choose \"{replace}\" to use it. A changed draft or another chat is not overwritten. The message\
        \ is never sent automatically.'),\n'pt-BR':('Ajuda para escrever: o novo bot\xE3o ap\xF3s Emoji e o menu de contexto\
        \ do campo abrem a mesma janela. Corrija, reformule, use um tom profissional ou encorajador com os provedores de IA\
        \ configurados, ou traduza com o Google. H\xE1 consentimento antes de enviar o rascunho e uma pr\xE9via antes de substitu\xED\
        -lo; a mensagem nunca \xE9 enviada automaticamente.', 'Escreva um rascunho e use \"{button}\" ap\xF3s \"{emoji}\"\
        , ou o menu de contexto do campo. A ajuda fica dispon\xEDvel para texto edit\xE1vel e n\xE3o vazio. As quatro a\xE7\
        \xF5es de escrita usam seus provedores de IA configurados; sem um provedor dispon\xEDvel, aparece apenas a tradu\xE7\
        \xE3o com o Google. Cada servi\xE7o pede consentimento pr\xF3prio antes de receber o texto. Confira o resultado e\
        \ escolha \"{replace}\" para us\xE1-lo. Um rascunho alterado ou outra conversa n\xE3o \xE9 sobrescrito. A mensagem\
        \ nunca \xE9 enviada automaticamente.'),\n'pt-PT':('Ajuda para escrever: o novo bot\xE3o ap\xF3s Emoji e o menu de\
        \ contexto do campo abrem a mesma janela. Corrija, reformule, use um tom profissional ou encorajador com os fornecedores\
        \ de IA configurados, ou traduza com o Google. \xC9 pedido consentimento antes de enviar o rascunho e \xE9 mostrada\
        \ uma pr\xE9via antes de o substituir; a mensagem nunca \xE9 enviada automaticamente.', 'Escreva um rascunho e use\
        \ \"{button}\" ap\xF3s \"{emoji}\", ou o menu de contexto do campo. A ajuda fica dispon\xEDvel para texto edit\xE1\
        vel e n\xE3o vazio. As quatro a\xE7\xF5es de escrita usam os seus fornecedores de IA configurados; sem um fornecedor\
        \ dispon\xEDvel, aparece apenas a tradu\xE7\xE3o com o Google. Cada servi\xE7o pede consentimento pr\xF3prio antes\
        \ de receber o texto. Confira o resultado e escolha \"{replace}\" para o usar. Um rascunho alterado ou outra conversa\
        \ n\xE3o \xE9 substitu\xEDdo. A mensagem nunca \xE9 enviada automaticamente.'),\n'it':('Aiuto alla scrittura: il nuovo\
        \ pulsante dopo Emoji e il menu contestuale del campo aprono la stessa finestra. Corregge, riformula, usa un tono\
        \ professionale o incoraggiante con i fornitori IA configurati, oppure traduce con Google. Chiede il consenso prima\
        \ di inviare la bozza e mostra il risultato prima di sostituirla; il messaggio non viene mai inviato automaticamente.',\
        \ 'Scrivi una bozza e usa \"{button}\" dopo \"{emoji}\", oppure il menu contestuale del campo. L\u2019aiuto \xE8 disponibile\
        \ per testo modificabile e non vuoto. Le quattro azioni di scrittura usano i fornitori IA configurati; senza un fornitore\
        \ disponibile viene offerta solo la traduzione con Google. Ogni servizio richiede un consenso separato prima di ricevere\
        \ il testo. Controlla il risultato e scegli \"{replace}\" per usarlo. Una bozza modificata o un\u2019altra chat non\
        \ viene sovrascritta. Il messaggio non viene mai inviato automaticamente.'),\n'pl':('Pomoc w pisaniu: nowy przycisk\
        \ po Emoji i menu kontekstowe pola otwieraj\u0105 to samo okno. Poprawiaj, przeredagowuj, stosuj ton profesjonalny\
        \ lub zach\u0119caj\u0105cy za pomoc\u0105 skonfigurowanych dostawc\xF3w AI albo t\u0142umacz przez Google. Przed\
        \ wys\u0142aniem szkicu wymagana jest zgoda, a przed zast\u0105pieniem pokazywany jest wynik; wiadomo\u015B\u0107\
        \ nigdy nie jest wysy\u0142ana automatycznie.', 'Napisz szkic i u\u017Cyj \"{button}\" po \"{emoji}\" lub menu kontekstowego\
