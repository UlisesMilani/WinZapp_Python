        \ sau \xEEncurajator cu furnizorii IA configura\u021Bi ori traduce cu Google. Cere acordul \xEEnainte de a trimite\
        \ ciorna \u0219i arat\u0103 rezultatul \xEEnainte de \xEEnlocuire; mesajul nu este trimis niciodat\u0103 automat.',\
        \ 'Scrie o ciorn\u0103 \u0219i folose\u0219te \"{button}\" dup\u0103 \"{emoji}\" sau meniul contextual al c\xE2mpului.\
        \ Ajutorul este disponibil pentru text editabil, care nu este gol. Cele patru ac\u021Biuni de scriere folosesc furnizorii\
        \ IA configura\u021Bi; f\u0103r\u0103 un furnizor disponibil este oferit\u0103 doar traducerea cu Google. Fiecare\
        \ serviciu cere acord separat \xEEnainte de a primi textul. Verific\u0103 rezultatul \u0219i alege \"{replace}\".\
        \ O ciorn\u0103 modificat\u0103 sau alt chat nu este suprascris. Mesajul nu este trimis niciodat\u0103 automat.'),\n\
        \ 'tr-TR':('Yazma yard\u0131m\u0131: Emoji sonras\u0131ndaki yeni d\xFC\u011Fme ve yaz\u0131 alan\u0131n\u0131n ba\u011F\
        lam men\xFCs\xFC ayn\u0131 pencereyi a\xE7ar. Yap\u0131land\u0131r\u0131lm\u0131\u015F yapay zeka sa\u011Flay\u0131\
        c\u0131lar\u0131yla d\xFCzeltme, yeniden yazma, profesyonel veya te\u015Fvik edici ton ya da Google ile \xE7eviri\
        \ sunar. Taslak g\xF6nderilmeden \xF6nce onay istenir ve de\u011Fi\u015Ftirmeden \xF6nce sonu\xE7 g\xF6sterilir; mesaj\
        \ hi\xE7bir zaman otomatik g\xF6nderilmez.', 'Bir taslak yaz\u0131p \"{emoji}\" sonras\u0131ndaki \"{button}\" d\xFC\
        \u011Fmesini veya alan\u0131n ba\u011Flam men\xFCs\xFCn\xFC kullan\u0131n. Yard\u0131m, bo\u015F olmayan ve d\xFC\
        zenlenebilir metin i\xE7in kullan\u0131labilir. D\xF6rt yazma i\u015Flemi yap\u0131land\u0131rd\u0131\u011F\u0131\
        n\u0131z yapay zeka sa\u011Flay\u0131c\u0131lar\u0131n\u0131 kullan\u0131r; uygun sa\u011Flay\u0131c\u0131 yoksa yaln\u0131\
        zca Google \xE7evirisi sunulur. Her hizmet metni almadan \xF6nce ayr\u0131 onay ister. Sonucu inceleyip kullanmak\
        \ i\xE7in \"{replace}\" se\xE7ene\u011Fini se\xE7in. De\u011Fi\u015Ftirilmi\u015F tasla\u011F\u0131n veya ba\u015F\
        ka bir sohbetin \xFCzerine yaz\u0131lmaz. Mesaj hi\xE7bir zaman otomatik g\xF6nderilmez.'),\n'ar':('\u0645\u0633\u0627\
        \u0639\u062F\u0629 \u0627\u0644\u0643\u062A\u0627\u0628\u0629: \u064A\u0641\u062A\u062D \u0627\u0644\u0632\u0631 \u0627\
