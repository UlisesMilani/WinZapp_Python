        \u0646\u062A\u064A\u062C\u0629 \u0642\u0628\u0644 \u0627\u0633\u062A\u0628\u062F\u0627\u0644\u0647\u0627\u061B \u0644\
        \u0627 \u062A\u064F\u0631\u0633\u0644 \u0627\u0644\u0631\u0633\u0627\u0644\u0629 \u062A\u0644\u0642\u0627\u0626\u064A\
        \u0627 \u0623\u0628\u062F\u0627.', '\u0627\u0643\u062A\u0628 \u0645\u0633\u0648\u062F\u0629 \u0648\u0627\u0633\u062A\
        \u062E\u062F\u0645 \xAB{button}\xBB \u0628\u0639\u062F \xAB{emoji}\xBB\u060C \u0623\u0648 \u0642\u0627\u0626\u0645\
