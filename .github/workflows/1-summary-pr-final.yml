name: Validate and prepare separate summary PR
permissions:
  contents: write
concurrency:
  group: summary-pr-final
  cancel-in-progress: false
jobs:
  test:
    name: Isolated summary and AI regression on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - name: Preserve exact source and patch bytes on Windows
      run: git config --global core.autocrlf false
    - name: Read validation inputs
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: validation
        persist-credentials: false
    - name: Read exact upstream base
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: gabrielhhaber/WinZapp_Python
        ref: 9411ae6424c29d22054bd2c8c010a1a34f6726f9
        path: app
        persist-credentials: false
        fetch-depth: 0
    - name: Verify and apply the complete reviewed patch
      shell: bash
      run: 'python - <<''PYVERIFY''

        import base64,gzip,hashlib,pathlib,subprocess

        b=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(b).hexdigest()==''d89a66b0a8d865f708c416251b8860e8f362b741fc2d531ccd199e6e20e0c7d2''

        p=pathlib.Path(''summary-final.patch'');p.write_bytes(b)

        assert subprocess.check_output([''git'',''-C'',''app'',''rev-parse'',''HEAD''],text=True).strip()==''9411ae6424c29d22054bd2c8c010a1a34f6726f9''

        subprocess.run([''git'',''-C'',''app'',''apply'',''--check'',str(p.resolve())],check=True)

        subprocess.run([''git'',''-C'',''app'',''apply'',str(p.resolve())],check=True)

        PYVERIFY

        '
    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - name: Set up uv without a shared cache
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: 0.12.13
        enable-cache: false
    - name: Install locked development dependencies
      working-directory: app
      run: uv sync --locked
    - name: Prepare isolated test network policy
      shell: bash
      run: "mkdir -p offline-policy\ncat > offline-policy/sitecustomize.py <<'PY'\nimport ipaddress\nimport sys\ndef offline_network(event,\
        \ args):\n    if event != 'socket.connect':\n        return\n    address = args[1]\n    if isinstance(address, tuple):\n\
        \        host = address[0]\n        if host == 'localhost':\n            return\n        try:\n            if ipaddress.ip_address(host).is_loopback:\n\
        \                return\n        except ValueError:\n            pass\n    raise PermissionError('External network\
        \ access is disabled during validation tests')\nsys.addaudithook(offline_network)\nPY\ncat > offline-policy/check_policy.py\
        \ <<'PY'\nimport socket\ntry:\n    socket.socket().connect(('203.0.113.1', 443))\nexcept PermissionError:\n    print('External\
        \ network guard active')\nelse:\n    raise AssertionError('network policy not loaded')\nPY\n"
    - name: Verify real Windows wx and warm COM imports
      working-directory: app
      run: uv run python -c "import sys, wx, comtypes.client, win32com.client.gencache; from accessible_output2 import outputs;
        print(sys.version); print(wx.version()); print(wx.PlatformInfo); comtypes.client.GetModule('oleacc.dll'); print('COM
        caches initialized before parallel workers')"
    - name: Run repository tests with real wx and no external connections
      working-directory: app
      shell: pwsh
      run: '$env:PYTHONPATH = "$env:GITHUB_WORKSPACE\offline-policy;$env:GITHUB_WORKSPACE\app;$env:GITHUB_WORKSPACE\app\client"

        $env:WINZAPP_VISUAL_OUTPUT = "$env:GITHUB_WORKSPACE\visual-output"

        $env:HF_HUB_OFFLINE = ''1''

        $env:TRANSFORMERS_OFFLINE = ''1''

        uv run python "$env:GITHUB_WORKSPACE\offline-policy\check_policy.py"

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        uv run python -c "import pathlib,subprocess,sys; files=sorted(str(p) for p in pathlib.Path(''tests'').glob(''test_ai_media*.py''))+[''tests/test_unread_summary.py'',''tests/test_unread_summary_adaptation.py''];
        assert not pathlib.Path(''client/ui/conversation_panel/ai_writing.py'').exists(); sys.exit(subprocess.call([sys.executable,''-m'',''pytest'',''--run-wx-gui'',''-q'']+files))"

        exit $LASTEXITCODE

        '
    - name: Preserve original contribution history and prepare PR branch
      shell: bash
      working-directory: app
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        git config user.name UlisesMilani

        git config user.email 210584228+UlisesMilani@users.noreply.github.com

        git fetch https://github.com/UlisesMilani/WinZapp_Python.git 74f9941d96e1eb164107cbbc7670407e3027d122

        git reset --hard 9411ae6424c29d22054bd2c8c010a1a34f6726f9

        git clean -fd

        git apply ../summary-final.patch

        git add -A

        tree=$(git write-tree)

        commit=$(printf ''%s

        '' ''Add AI summaries of unread chat messages'' | git commit-tree "$tree" -p 9411ae6424c29d22054bd2c8c010a1a34f6726f9
        -p 74f9941d96e1eb164107cbbc7670407e3027d122)

        auth=$(printf ''x-access-token:%s'' "$GH_TOKEN" | base64 | tr -d ''

        '')

        git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push https://github.com/UlisesMilani/WinZapp_Python.git
        "$commit:refs/heads/unread-summary-5418"

        printf ''Prepared commit %s

        '' "$commit"

        '
'on':
  push:
    branches:
    - ai-prototype-validation-5403
    paths:
    - .github/workflows/*summary-pr-final.yml
env:
  PYTHON_VERSION: '3.13'
  PYTHONUTF8: '1'
